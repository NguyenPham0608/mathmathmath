<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Times Tables & Division</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #f5f7fb;
    color: #1d2433;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    padding: 0 16px;
  }
  button {
    border: 2px solid #4f6ef7;
    background: #fff;
    color: #4f6ef7;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 1.6rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.on { background: #4f6ef7; color: #fff; }
  .limit { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
  .limit input {
    width: 3.5em;
    font: inherit;
    font-size: 1.4rem;
    text-align: center;
    padding: 10px;
    border: 2px solid #4f6ef7;
    border-radius: 12px;
    background: #fff;
    color: #1d2433;
  }
  .limit input:focus { outline: none; }

  /* Countdown bar pinned to the bottom of the screen */
  .timerbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18px;
    background: #dfe4f0;
    display: none;
  }
  .timerbar.on { display: block; }
  .timerbar div {
    height: 100%;
    width: 100%;
    background: #4f6ef7;
    transition: background 0.3s;
  }
  .timerbar div.low { background: #e5484d; }

  .problem {
    font-size: min(24vw, 16vh);
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1.1;
  }
  .stack { display: inline-flex; flex-direction: column; align-items: flex-end; }
  .stack .line { display: flex; align-items: center; gap: 0.25em; }
  .stack .op { width: 0.6em; text-align: center; }
  .bar { width: 100%; height: 0.08em; background: #1d2433; border-radius: 2px; margin: 0.06em 0; }
  .frac { display: inline-flex; align-items: center; gap: 0.3em; }
  .frac .col { display: flex; flex-direction: column; text-align: center; min-width: 1.4em; }
  input[type="text"] {
    width: 2.6em;
    font: inherit;
    font-weight: 700;
    text-align: center;
    border: none;
    border-radius: 0;
    background: transparent;
    color: #1d2433;
    padding: 0;
  }
  input[type="text"]:focus { outline: none; }
  .feedback { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; min-height: 2.5rem; font-size: 2rem; font-weight: 700; padding: 0 16px; }
  .good { color: #22a06b; }
  .bad { color: #e5484d; }
</style>
</head>
<body>
<div class="row">
  <button id="tabMul" class="on">Times</button>
  <button id="tabDiv">Division</button>
  <label class="limit">Seconds
    <input id="limit" type="text" value="10" autocomplete="off" aria-label="Seconds per answer, max 10">
  </label>
</div>

<div class="problem" id="problem"></div>
<div class="feedback" id="feedback"></div>

<div class="timerbar" id="timerbar"><div id="fill"></div></div>

<script>
  const MAX = 10;          // largest number in a problem
  const MAX_SECONDS = 10;  // largest time limit
  let mode = "mul";
  let current = null;
  let deadline = null;
  let totalMs = 0;
  let ticker = null;

  const $ = (id) => document.getElementById(id);

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makeQuestion() {
    const x = randInt(1, MAX);
    const y = randInt(1, MAX);
    if (mode === "mul") return { a: x, b: y, answer: x * y };
    // division: dividend = x * y, so it always divides evenly
    return { a: x * y, b: x, answer: y };
  }

  function makeInput() {
    const input = document.createElement("input");
    input.type = "text";
    input.id = "answer";
    input.autocomplete = "off";
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") check();
    });
    return input;
  }

  function renderProblem() {
    const box = $("problem");
    box.innerHTML = "";
    if (mode === "mul") {
      box.innerHTML = `
        <div class="stack">
          <div class="line"><span>${current.a}</span></div>
          <div class="line"><span class="op">×</span><span>${current.b}</span></div>
          <div class="bar"></div>
          <div class="line"><span class="answer-slot"></span></div>
        </div>`;
      box.querySelector(".answer-slot").appendChild(makeInput());
    } else {
      box.innerHTML = `
        <div class="frac">
          <div class="col"><span>${current.a}</span><div class="bar"></div><span>${current.b}</span></div>
          <span>=</span>
        </div>`;
      box.querySelector(".frac").appendChild(makeInput());
    }
    $("answer").focus();
  }

  // Returns the time limit in seconds, or 0 for no limit
  function getLimit() {
    const raw = $("limit").value.trim();
    const v = Number(raw);
    if (raw === "" || !(v >= 1)) return 0;
    return Math.min(v, MAX_SECONDS);
  }

  function startTimer() {
    cancelAnimationFrame(ticker);
    const limit = getLimit();
    const bar = $("timerbar");
    const fill = $("fill");
    if (!limit) {
      deadline = null;
      bar.classList.remove("on");
      return;
    }
    totalMs = limit * 1000;
    deadline = Date.now() + totalMs;
    bar.classList.add("on");
    fill.classList.remove("low");
    fill.style.width = "100%";
    ticker = requestAnimationFrame(tick);
  }

  function tick() {
    const leftMs = Math.max(0, deadline - Date.now());
    const fill = $("fill");
    fill.style.width = (leftMs / totalMs * 100) + "%";
    fill.classList.toggle("low", leftMs <= 3000);
    if (leftMs <= 0) {
      timeUp();
    } else {
      ticker = requestAnimationFrame(tick);
    }
  }

  function timeUp() {
    cancelAnimationFrame(ticker);
    const fb = $("feedback");
    fb.className = "feedback bad";
    fb.textContent = `Time's up! ${questionText()} = ${current.answer}`;
    next();
  }

  function questionText() {
    const sign = mode === "mul" ? "×" : "÷";
    return `${current.a} ${sign} ${current.b}`;
  }

  function next() {
    current = makeQuestion();
    renderProblem();
    startTimer();
  }

  function check() {
    const raw = $("answer").value.trim();
    if (raw === "") return;
    const fb = $("feedback");
    if (Number(raw) === current.answer) {
      fb.className = "feedback good";
      fb.textContent = "Correct!";
      next();
    } else {
      fb.className = "feedback bad";
      fb.textContent = `Not quite. ${questionText()} = ${current.answer}`;
      $("answer").value = "";
      $("answer").focus();
    }
  }

  function setMode(m) {
    mode = m;
    $("tabMul").classList.toggle("on", m === "mul");
    $("tabDiv").classList.toggle("on", m === "div");
    $("feedback").textContent = "";
    next();
  }

  // Keep the seconds box to digits, max 10; changing it restarts the bar
  $("limit").addEventListener("input", () => {
    const limitBox = $("limit");
    limitBox.value = limitBox.value.replace(/[^0-9]/g, "").slice(0, 2);
    if (Number(limitBox.value) > MAX_SECONDS) limitBox.value = String(MAX_SECONDS);
    if (current) startTimer();
  });

  $("tabMul").onclick = () => setMode("mul");
  $("tabDiv").onclick = () => setMode("div");

  next();
</script>
</body>
</html>
